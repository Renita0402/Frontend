<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
         <header class="header">

        <div class="logo">
            Student Dashboard
        </div>

        <nav class="navigation">
        </nav>
    </header>
      <main>

        <h1 id="dashboard-title">Welcome, Renita!</h1>

        <p class="description">
           <h2> Here is your academic performance and course information</h2>.
        </p>
        <section class="dashboard">

            <div class="card">
                <h2>Courses</h2>
                <p>5</p>

            </div>

            <div class="card">
                <h2>Grades</h2>
                <p>85%</p>
                <span>Average Grade</span>
            </div>

            <div class="card">
                <h2>Attendance</h2>
                <p>90%</p>
                <span>Overall Attendance</span>
            </div>

        </section>
    </main>
</body>
</html>
