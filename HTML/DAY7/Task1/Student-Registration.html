<html>
<head>
    <title>REGISTRATION FORM</title>
</head>
<body>
    <center>
    <header><h1>SLA INSTITUTE </h1></header>
    <h2>STUDENT REGISTRATION FORM</h2>
    <br>
    <form>
       <p> <label for="STUDENT NAME">STUDENT NAME:</label>
        <input type="STUDENT NAME" id="STUDENT NAME"  placeholder="IN BLOCK LETTERS" required></p>
        
        <p><label for="emai">EMAIL ID:</label>
        <input type="email" id="emai" required></p>

        <p><label for="password">PASSWORD:</label>
        <input type="password" id="password"></p>

       <p> <label for="tel">Mobile Number</label>
        <input type="number" id="tel" min="10" max="10" required></p>

        <p></p><label for="Gender">Gender</label>
        <input type="radio" name="Gender"> MALE
        <input type="radio" name="Gender"> FEMALE</p>

        <p><label for="Age">Age:</label>
        <input type="number" name="AGE" id="AGE" min="18" max="35"></p>

        <p><label for="Skills">Skills:</label>
        <input type="checkbox" name="Skills">HTML
        <input type="checkbox" name="Skills">Css
        <input type="checkbox" name="Skills">JS
        <input type="checkbox" name="Skills">Bootstrap
        <input type="checkbox" name="Skills">React
        <input type="checkbox" name="Skills">SQL
        <input type="checkbox" name="Skills">Python</p>

       <p> <label for="Select">Course Selection</label>
        <select name="" id="Course Selection">
            <option value=""Select disabled>Select one</option>     
            <option value="FullStack Development">FullStack Development</option>
            <option value="Python Full Stack"> Python Full Stack</option>
            <option value="Java Full Stack">Java Full Stack</option>
            </select></p>

        <p><label for="Address">Address:</label>
        <textarea id="Address"></textarea></p>
        
        <p><label for="STUDENT Image">Student Image:</label>
        <input type="file" id="STUDENT IMAGE"></p>
    
       <p><label for="Submit">Submit</label>
        <input type="button" id="Submit" value="Register"></p>

       <input type="submit" value="Resgiter">
        <input type="reset" value="Reset">
 </form>
</center>    
</body>
</html>
