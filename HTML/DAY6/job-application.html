<html>
<head>
    <title>Job Application Form</title>
</head>
<body>
<center>
    <header><h2>JOB APPLICATION FORM</h2></header>

    <main>
    <form method="post">

        <p><label>Full Name:</label>
        <input type="text" placeholder="Enter Full Name" required></p>

        <p><label>Email ID:</label>
        <input type="email" placeholder="Enter Email ID" required></p>

        <p><label>Phone Number:</label>
        <input type="tel" placeholder="Enter Phone Number" required></p>

        <p><label>Date of Birth:</label>
            <input type="date" required></p>

            <p><label>Education:</label>
            <select required>
            <option>Select Qualification</option>
            <option>B.Sc Computer Science</option>
            <option>BCA</option>
            <option>B.E</option>
            <option>MCA</option>
            </select></p>

        <p><label>Department:</label>
            <input type="text" placeholder="Enter Department" required></p>

        <p><label>Position:</label>
            <select required>
            <option>Select Position</option>
            <option>Web Developer</option>
            <option>UI Designer</option>
            <option>Software Tester</option>
            </select></p>

        <p><label>Skills:</label>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JavaScript</p>

        <input type="hidden" value="job">

        <p><input type="submit" value="Apply">
    </form>
</main>
</center>
</body>
</html>
