
<html>
<head>
    <title>COLLEGE REGISTRATION FORM</title>
</head>
<body>
    <center>
    <header><h1>ABC ENGINEERING COLLEGE </h1></header>
    <h2>COLLEGE REGISTRATION FORM</h2>
    <br>
    <form>
       <p> <label for="STUDENT NAME">STUDENT NAME:</label>
        <input type="STUDENT NAME" id="STUDENT NAME"  placeholder="IN BLOCK LETTERS" required></p>

        <p> <label for="FATHER NAME">FATHER NAME:</label>
        <input type="FATHER NAME" id="FATHER NAME"  placeholder="IN BLOCK LETTERS" required></p>

        <p> <label for="MOTHER NAME">MOTHER NAME:</label>
        <input type="MOTHER NAME" id="MOTHER NAME"  placeholder="IN BLOCK LETTERS" required></p>
        
        <p><label for="emai">EMAIL ID:</label>
        <input type="email" id="emai" required></p>

         <p> <label for="tel">Mobile Number</label>
        <input type="number" id="tel" min="10" max="10" required></p>

        <p></p><label for="Gender">Gender</label>
        <input type="radio" name="Gender"> MALE
        <input type="radio" name="Gender"> FEMALE</p>

        <p> <label for="Department">Department:</label>
        <input type="text" id="Department"required></p>
    
        <p> <label for="Percentage">Percentage:</label>
        <input type="number" id="Percentage"required></p>

        <p><label for="Address">Address:</label>
        <textarea id="Address"></textarea></p>

        <p><label for="Passport Size Photo">Passport Size Photo:</label>
        <input type="file" id="Passport Size Photo"></p>

      
        <input type="submit" value="Resgiter">
        <input type="reset" value="Reset">

    </form>
</center>    
</body>
</html>
