<html>
<head>
    <title>Login Form</title>
</head>

<body>
<center>
        <header><h2>LOGIN FORM</h2></header>
    <main>
        <form method="post">
   
        <p><label>Username:</label>
        <input type="text" placeholder="Enter Username" required></p>

        <p><label>Email ID:</label>
        <input type="email" placeholder="Enter Email ID" required></p>

        <p><label>Password:</label>
        <input type="password" placeholder="Enter Password" required></p>

        <input type="hidden" value="login">

        <p><input type="submit" value="Login"></p>

    </form>
</main>
</center>

</body>
</html>
