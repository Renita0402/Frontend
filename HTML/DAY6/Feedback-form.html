<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
<center>
    <header><h2>FEEDBACK FORM</h2></header>
    
    <main>
    <form method="post">
        <p><label>Name:</label>
        <input type="text" placeholder="Enter Name" required></p>

        <p><label>Rating:</label>
            <input type="radio" name="rate"> Good
            <input type="radio" name="rate"> Average
            <input type="radio" name="rate"> Poor</p>

        <p><label>Feedback:</label><br>
        <textarea rows="4" cols="25" placeholder="Enter Feedback"></textarea></p>

        <input type="hidden" value="feedback">
        
        <p><input type="submit" value="Submit"></p>

    </form>
</main>
</center>

</body>
</html>
