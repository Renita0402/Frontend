<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Lift Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/300/200?random=1" alt="Product 1">
            <h2>Watch</h2>
            <p>₹1,500</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=2" alt="Product 2">
            <h2>Shoes</h2>
            <p>₹2,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=3" alt="Product 3">
            <h2>Bag</h2>
            <p>₹1,200</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=4" alt="Product 4">
            <h2>Headphones</h2>
            <p>₹2,500</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
