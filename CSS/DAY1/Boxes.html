<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Five Colored Boxes</title>

    <style>
        .box3 {
            background-color: rgb(66, 150, 66);
            color: rgb(85, 214, 85);
            width: 400px;
            height: 150px;
            text-align: center;
        }

        .box4 {
            background-color: rgb(9, 125, 179);
            color: brown;
            width: 400px;
            height: 150px;
            text-align: center;
        }

        .box5 {
            background-color: rgb(117, 64, 72);
            color: red;
            width: 400px;
            height: 150px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Five Colored Boxes</h1>

    <!-- Box 1 - Inline CSS -->
    <div style="background-color: rgb(55, 98, 112); color: blue; width: 400px; height: 150px; text-align: center;">
        <h2>Box One</h2>
        <p>This is the first colored box.</p>
    </div>

    <!-- Box 2 - Inline CSS -->
    <div style="background-color: rgb(102, 92, 158); color: black; width: 400px; height: 150px; text-align: center;">
        <h2>Box Two</h2>
        <p>This is the second colored box.</p>
    </div>

    <!-- Box 3 - Internal CSS -->
    <div class="box3">
        <h2>Box Three</h2>
        <p>This is the third colored box.</p>
    </div>

    <!-- Box 4 - Internal CSS -->
    <div class="box4">
        <h2>Box Four</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <!-- Box 5 - Internal CSS -->
    <div class="box5">
        <h2>Box Five</h2>
        <p>This is the fifth colored box.</p>
    </div>

</body>
</html>
