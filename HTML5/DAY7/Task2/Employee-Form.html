<html>
<head>
    <title>Employee form</title>
</head>
<body>
    <center
    <header>
        <h1>ABC SOFTWARE COMPANY</h1>
        <h2>EMPLOYEE REGISTRATION FORM</h2>
    </header>
    <br>
    <form> 
        <p><label for="Employee Id">Employee Id:</label>
        <input type="Employee Id" id="Employee Id" required></p>
         
        <p><label for="Employee Name">Employee Name:</label>
        <input type="Employee Name" id="Employee Name" placeholder="Enter your name in block letters" required></p>

        <p><label for="emai">EMAIL ID:</label>
        <input type="email" id="emai" required></p>

        <p><label for="tel">Mobile Number:</label>
        <input type="number" id="tel" min="10" max="10" required></p>

        <p> <label for="Department">Department:</label>
        <input type="text" id="Department"required></p>
    
         <p><label for="Experience">Experience:</label>
        <input type="text" id="Experience" required></p>
        
        <p><label for="Salary">Salary:</label>
        <input type="number" id="Salary" required></p>

        <p><label for="Skills">Skills:</label>
        <input type="text" id="Skills" required></p>

        <p><label for="Upload Resume">Upload Resume:</label>
        <input type="file" id="Upload Resume" required></p>

        <input type="submit" value="Resgiter">
        <input type="reset" value="Reset">
    </form>
</center> 
</body>
</html>
