<html>
<head>
    <title>product formm</title> 
</head>
<body>
    <center
    <header>
        <h1>PRODUCT REGISTRATION FORM</h1>
    </header>
    <br>
    <form> 
        <p><label for="Product Id">Product  Id:</label>
        <input type="Product  Id" id="Product Id" required></p>
         
        <p><label for="Product Name">Product Name:</label>
        <input type="Product  Name" id="Product Name" placeholder="Enter your name in block letters" required></p>

         <p><label for="brand">Brand:</label>
        <input type="text" id="brand" placeholder="Enter Brand" required></p>

        <p><label for="category">Category:</label>
            <select id="category" required>
                <option>Select Category</option>
                <option>Mobile</option>
                <option>Laptop</option>
                <option>Television</option>
                <option>Headphones</option>
            </select></p>

        <p> <label for="price">Price:</label>
        <input type="number" id="price" placeholder="Enter Price" required></p> 
            
        <p><label for="quantity">Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter Quantity" required></p>  
        
        <p> <label for="supplier">Supplier:</label>
            <input type="text" id="supplier" placeholder="Enter Supplier Name" required></p>

        <p> <label for="productimage">Product Image:</label>
            <input type="file" id="productimage"></p>

        <input type="submit" value="Resgiter">
        <input type="reset" value="Reset">

        </form>
</center>    
</body>
</html>
