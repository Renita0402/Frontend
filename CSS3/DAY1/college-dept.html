<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Departments</title>

    <style>
        div {
            width: 300px;
            height: 50px;
            text-align: center;
            color: white;
        }

        .cse {
            background-color: rgb(136, 150, 177);
        }

        .it {
            background-color: rgb(64, 168, 128);
        }

        .ece {
            background-color: rgb(247, 197, 106);
        }

        .eee {
            background-color: rgb(226, 146, 226);
        }

        .mechanical {
            background-color: rgb(233, 111, 111);
        }
    </style>
</head>

<body>
    <h1>Engineering Departments</h1>

    <div class="cse">
        <h2>CSE</h2>
    </div>

    <div class="it">
        <h2>IT</h2>
    </div>

    <div class="ece">
        <h2>ECE</h2>
    </div>

    <div class="eee">
        <h2>EEE</h2>
    </div>

    <div class="mechanical">
        <h2>Mechanical</h2>
    </div>

</body>
</html>
